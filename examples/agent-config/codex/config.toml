# /etc/codex/config.toml — OpenAI Codex CLI governed by the control layer (stretch goal)
# Codex only speaks the OpenAI *Responses* wire API, so the gateway must expose /v1/responses (stateless).
# Pair with /etc/codex/requirements.toml to pin model_provider so users cannot switch it.
model_provider = "controllayer"
model = "qwen3:8b"

[model_providers.controllayer]
name = "AI Control Layer"
base_url = "http://gateway.core:8080/v1"
env_key = "CONTROL_LAYER_KEY"
wire_api = "responses"
